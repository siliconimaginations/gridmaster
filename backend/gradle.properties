# Kotlin / JVM
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC

# Build cache — reuses outputs from identical task inputs across runs.
# Speeds up CI by ~30-60s on cache hits for compile/lint tasks.
org.gradle.caching=true

# Parallel module compilation (no effect on single-module build but
# harmless and ready for when submodules are added).
org.gradle.parallel=true

# Configuration cache reduces configuration phase overhead.
org.gradle.configuration-cache=true
