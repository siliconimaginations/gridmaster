<svg xmlns="http://www.w3.org/2000/svg" width="140" height="20" role="img" aria-label="e2e coverage: 13/13">
  <title>e2e coverage: 13/13</title>
  <linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
  <clipPath id="r"><rect width="140" height="20" rx="3" fill="#fff"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="100" height="20" fill="#555"/>
    <rect x="100" width="40" height="20" fill="#4c1"/>
    <rect width="140" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle"   font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="110">
    <text x="500" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)"     textLength="900" lengthAdjust="spacing">e2e coverage</text>
    <text x="500" y="140" transform="scale(.1)"     textLength="900" lengthAdjust="spacing">e2e coverage</text>
    <text x="1200" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)"     textLength="300" lengthAdjust="spacing">13/13</text>
