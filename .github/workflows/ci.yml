name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed to post coverage comment
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      - name: Build
        run: ./gradlew build -x test

      - name: Unit tests + coverage
        run: ./gradlew test jacocoTestReport

      - name: Integration tests
        run: ./gradlew test -Pintegration
        continue-on-error: false

      - name: Post backend coverage comment
        uses: Madrapps/jacoco-report@v1.7.0
        # Only comment on pull requests, not on direct pushes to main.
        if: github.event_name == 'pull_request'
        with:
          paths: backend/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Backend Coverage (JaCoCo)
          update-comment: true
          min-coverage-overall: 40    # low threshold — rises as implementation grows
          min-coverage-changed-files: 50

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed to post coverage comment
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests + coverage
        run: npm run test:coverage

      - name: Post frontend coverage comment
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request'
        with:
          name: Frontend Coverage (Vitest)
          json-summary-path: frontend/coverage/coverage-summary.json
          json-final-path: frontend/coverage/coverage-final.json
          vite-config-path: frontend/vite.config.ts
