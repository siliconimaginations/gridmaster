# CI — runs on every pull request and on push to main.
#
# Jobs run in parallel where there are no dependencies:
#
#   backend-lint ──┐
#   backend-test ──┼── (all independent)
#   frontend-lint ─┤
#   frontend-test ─┘
#
# Total wall-clock target: < 3.5 min (vs. ~5 min sequential).

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs for the same branch/PR when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend — lint (fast gate, ~15 s)
  # ─────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend lint (ktlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck --build-cache

  # ─────────────────────────────────────────────────────────────────────────
  # Backend — build + unit tests + coverage (~2.5 min)
  # ─────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend test (Kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read         # read-only — badge commit is in backend-badge job
      pull-requests: write   # post JaCoCo coverage comment
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build (skip tests — compile check only)
        run: ./gradlew build -x test --build-cache

      - name: Unit tests + coverage
        run: ./gradlew test jacocoTestReport --build-cache

      - name: Print coverage summary
        if: always()
        run: |
          echo "### Backend Coverage (JaCoCo)" >> $GITHUB_STEP_SUMMARY
          python3 - << 'PY'
          import xml.etree.ElementTree as ET, os
          report = "build/reports/jacoco/test/jacocoTestReport.xml"
          if not os.path.exists(report):
              print("No coverage report found.")
          else:
              tree = ET.parse(report)
              root = tree.getroot()
              for counter in root.findall("counter"):
                  if counter.get("type") == "LINE":
                      missed = int(counter.get("missed", 0))
                      covered = int(counter.get("covered", 0))
                      total = missed + covered
                      pct = 100 * covered / total if total else 0
                      print(f"Overall line coverage: {pct:.1f}% ({covered}/{total})")
          PY
        working-directory: backend

      - name: Upload coverage report (artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/build/reports/jacoco/test/
          retention-days: 14

      - name: Post coverage comment on PR
        uses: Madrapps/jacoco-report@v1.7.0
        if: github.event_name == 'pull_request'
        with:
          paths: backend/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Backend Coverage (JaCoCo)
          update-comment: true
          min-coverage-overall: 60
          min-coverage-changed-files: 70

      - name: Upload JaCoCo CSV (consumed by backend-badge)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: backend-jacoco-csv
          path: backend/build/reports/jacoco/test/jacocoTestReport.csv
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # Backend — integration tests (tagged "integration", uses real PowSyBl solver)
  # Runs separately so it does not block the fast unit-test gate.
  # ─────────────────────────────────────────────────────────────────────────
  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Integration tests
        run: ./gradlew test -Pintegration --build-cache

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — lint (fast gate, ~20 s)
  # ─────────────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — build + tests + coverage (~30 s)
  # ─────────────────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend test (TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read         # read-only — badge commit is in frontend-badge job
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests + coverage
        run: npm run test:coverage

      - name: Post frontend coverage comment
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request'
        with:
          name: Frontend Coverage (Vitest)
          json-summary-path: frontend/coverage/coverage-summary.json
          json-final-path: frontend/coverage/coverage-final.json
          vite-config-path: frontend/vite.config.ts

      - name: Upload coverage summary (consumed by frontend-badge)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: frontend-coverage-summary
          path: frontend/coverage/coverage-summary.json
          retention-days: 1

  # Isolated job: write access for badge commit, only runs on push to main.
  # Keeping contents:write out of frontend-test prevents fork PRs from
  # obtaining write permission via a compromised dependency.
  frontend-badge:
    name: Frontend badge update
    needs: frontend-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true  # Badge commit is blocked by branch protection; failure is cosmetic
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download coverage summary
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-summary
          path: frontend/coverage

      - name: Generate frontend coverage badge
        working-directory: frontend
        run: python3 scripts/gen_vitest_badge.py

      - name: Commit frontend coverage badge
        uses: EndBug/add-and-commit@v10
        with:
          add: .github/badges/vitest.svg
          message: 'ci: update frontend coverage badge [skip ci]'
          default_author: github_actions

  # Isolated job: write access for badge commit, only runs on push to main.
  # Mirrors the same isolation applied to frontend-badge.
  backend-badge:
    name: Backend badge update
    needs: backend-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true  # Badge commit is blocked by branch protection; failure is cosmetic
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download JaCoCo CSV
        uses: actions/download-artifact@v4
        with:
          name: backend-jacoco-csv
          path: backend/build/reports/jacoco/test

      - name: Generate coverage badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: backend/build/reports/jacoco/test/jacocoTestReport.csv
          badges-directory: .github/badges
          generate-coverage-badge: true
          coverage-badge-filename: jacoco.svg

      - name: Commit coverage badge
        uses: EndBug/add-and-commit@v10
        with:
          add: .github/badges/jacoco.svg
          message: 'ci: update coverage badge [skip ci]'
          default_author: github_actions
