name: E2E tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read   # e2e job; badge commit is in e2e-badge job below

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-22.04   # host VM; the container below runs on top
    container:
      image: mcr.microsoft.com/playwright:v1.44.1-jammy  # Chromium + deps pre-installed; no install step needed
      options: --user root
    timeout-minutes: 20     # cold: ~12min (Gradle build + backend + tests); warm: ~8min

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build backend (skip tests)
        working-directory: backend
        run: ./gradlew build -x test --no-daemon

      - name: Start backend
        working-directory: backend
        run: |
          ./gradlew bootRun --no-daemon > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          for i in $(seq 1 30); do
            if ! kill -0 $BACKEND_PID 2>/dev/null; then tail -50 /tmp/backend.log; exit 1; fi
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done

      - name: Build frontend (e2e mode)
        working-directory: frontend
        run: npm run build:e2e

      - name: Start frontend preview server
        working-directory: frontend
        run: npx vite preview --port 5173 &

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run e2e
        env:
          BASE_URL: http://localhost:5173
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 14

  # Isolated job: write access for badge commits, only runs on push to main.
  # Generates two badges: e2e-coverage.svg and e2e-pass.svg.
  # Mirrors the isolation pattern used by frontend-badge / backend-badge in ci.yml.
  # See docs/engineering/16-e2e-coverage-workflow.md for metric definitions.
  e2e-badge:
    name: E2E badge update
    runs-on: ubuntu-22.04
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write   # needed to commit the SVG badges

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Generate E2E badges (coverage + pass rate)
        run: python3 scripts/gen_e2e_badges.py

      - name: Commit E2E badges
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true   # GH006 branch-protection blocks bot push; badges are cosmetic
        with:
          file_pattern: .github/badges/e2e-coverage.svg .github/badges/e2e-pass.svg
          commit_message: 'ci: update e2e badges [skip ci]'

