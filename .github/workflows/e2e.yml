name: E2E tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read   # e2e job; badge and issue jobs override below

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-22.04   # host VM; the container below runs on top
    container:
      image: mcr.microsoft.com/playwright:v1.44.1-jammy  # Chromium + deps pre-installed; no install step needed
      options: --user root
    timeout-minutes: 20     # cold: ~12min (Gradle build + backend + tests); warm: ~8min

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build backend (skip tests)
        working-directory: backend
        run: ./gradlew build -x test --no-daemon

      - name: Start backend
        working-directory: backend
        run: |
          ./gradlew bootRun --no-daemon > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          for i in $(seq 1 30); do
            if ! kill -0 $BACKEND_PID 2>/dev/null; then tail -50 /tmp/backend.log; exit 1; fi
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done

      - name: Build frontend (e2e mode)
        working-directory: frontend
        run: npm run build:e2e

      - name: Start frontend preview server
        working-directory: frontend
        run: npx vite preview --port 5173 &

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run e2e
        env:
          BASE_URL: http://localhost:5173
          BACKEND_URL: http://localhost:8080
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 14

  # ── Badge update ──────────────────────────────────────────────────────────────
  # Isolated job: write access for badge commits.
  # Runs even on e2e failure (always()) so badges reflect the real broken state
  # rather than staying stale at last-known-good values.
  # Badges are committed to the unprotected ci/badges branch to avoid
  # branch-protection rejections on main.
  # See docs/engineering/16-e2e-coverage-workflow.md for metric definitions.
  e2e-badge:
    name: E2E badge update
    runs-on: ubuntu-22.04
    needs: e2e
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: badge-push-ci-badges
      cancel-in-progress: false  # queue, don't cancel — shares group with ci.yml badge jobs
    permissions:
      contents: write   # needed to push to ci/badges branch

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Generate E2E badges (coverage + pass rate)
        run: python3 scripts/gen_e2e_badges.py

      - name: Push badges to ci/badges branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          mkdir -p /tmp/badges
          cp .github/badges/e2e-coverage.svg /tmp/badges/e2e-coverage.svg
          cp .github/badges/e2e-pass.svg /tmp/badges/e2e-pass.svg
          if git ls-remote --exit-code --heads origin ci/badges >/dev/null 2>&1; then
            git fetch origin ci/badges:refs/remotes/origin/ci/badges
            git checkout -b ci/badges FETCH_HEAD
          else
            git checkout --orphan ci/badges
            git rm -rf . --quiet 2>/dev/null || true
          fi
          mkdir -p .github/badges
          cp /tmp/badges/e2e-coverage.svg .github/badges/e2e-coverage.svg
          cp /tmp/badges/e2e-pass.svg .github/badges/e2e-pass.svg
          git add .github/badges/e2e-coverage.svg .github/badges/e2e-pass.svg
          git diff --staged --quiet || git commit -m "ci: update e2e badges [skip ci]"
          git push origin ci/badges

  # ── Failure issue creation ────────────────────────────────────────────────────
  # Creates or updates GitHub issues for each failing implemented e2e scenario.
  # Deduplication: if an open issue with label `e2e-failure` already covers the
  # same feature ID, a comment is added instead of creating a duplicate issue.
  # New issues are added to the GridMaster Backlog board (project #2) as P1.
  #
  # Only runs on main-branch push AND only when the e2e job failed — avoids
  # noisy issue creation for PRs or scheduled/manual runs that happen to fail.
  e2e-failure-issues:
    name: E2E failure issues
    runs-on: ubuntu-22.04
    needs: e2e
    if: always() && needs.e2e.result == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      issues: write     # create issues and comments
      contents: read    # read catalogue + results artifact

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Create or update failure issues
        run: python3 scripts/e2e_failure_issues.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_PAT }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
