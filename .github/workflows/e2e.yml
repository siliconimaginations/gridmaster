name: E2E tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-22.04   # pin to Jammy — ubuntu-latest is now Noble (24.04) where libasound2 was renamed
    timeout-minutes: 35     # Gradle cold build ~2min (cached), Playwright install ~2min (cached), tests ~10min

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cache Gradle build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            backend/build
          key: gradle-e2e-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-e2e-${{ runner.os }}-

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            # Cache hit — only install system deps (fast, ~10s)
            npx playwright install-deps chromium
          else
            # Cache miss — full install including browser binary (~2min)
            npx playwright install chromium --with-deps
          fi

      - name: Build backend (skip tests)
        working-directory: backend
        run: ./gradlew build -x test --no-daemon

      - name: Start backend
        working-directory: backend
        run: |
          ./gradlew bootRun --no-daemon > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"
          echo "Waiting for /actuator/health…"
          for i in $(seq 1 30); do
            if ! kill -0 $BACKEND_PID 2>/dev/null; then
              echo "Backend process died. Last 50 lines:" && tail -50 /tmp/backend.log
              exit 1
            fi
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done

      - name: Build frontend (e2e mode — includes __e2e bridge)
        working-directory: frontend
        run: npm run build:e2e

      - name: Start frontend preview server
        working-directory: frontend
        run: npx vite preview --port 5173 &

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run e2e
        env:
          BASE_URL: http://localhost:5173
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 14

